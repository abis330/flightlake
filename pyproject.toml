[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightlake"
version = "0.1.0"
description = "Aerospace telemetry data platform: ingest, clean, index and query flight logs (PX4 ULog, CSV, LAT-style sim logs)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "duckdb>=1.0", "pyyaml>=6",
  "typer>=0.12", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2",
]

[project.optional-dependencies]
ulog = ["pyulog>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "pyulog>=1.0"]

[project.scripts]
flightlake = "flightlake.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731"]
